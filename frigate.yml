mqtt:
  enabled: true
  host: mosquitto
  topic_prefix: frigate  # Force this so Go finds it

record:
  enabled: true

  alerts:
    retain:
      days: 14
      mode: active_objects
  detections:
    retain:
      days: 14
      mode: active_objects
snapshots:
  enabled: true
  bounding_box: true
  retain:
    default: 3
motion:
  threshold: 15
  contour_area: 15

objects:
  track:
    - person
  filters:
    person:
      min_area: 300    # 300 min number of picles for the object
      min_score: 0.4   # percentage confidence  0.4 is 40% probability
      threshold: 0.5   # rolling average confidence.  0.5 is 50%

# YOLOv9-t (320, exported on alarm into frigate_config/model_cache) replaces ssdlite_mobilenet_v2:
# 10.7 ms vs 7.4 ms per inference, but far fewer night false hits (cabana spider webs, fog)
model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolov9-t-320.onnx
  labelmap_path: /labelmap/coco-80.txt

detectors:
  ov:
    type: openvino
    device: GPU
go2rtc:
  streams:
    Pool_farside:
      - rtsp://admin:{FRIGATE_CAM_PASSWORD_1}@192.168.78.63:554/h265Preview_01_main
cameras:
  pool_from_cabana:
    enabled: true
    record:
      motion:
        days: 3
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_CAM_PASSWORD_2}@192.168.78.51:9008/profile1
          roles:
            - detect
            - record # profile0 does not exist on the O2VLB5; profile1 (1080p) is its best stream
    detect:
      enabled: true
      width: 1920
      height: 1080
      fps: 5

    objects:
      filters:
        person:
          mask:
            - 0.053,0.413,0.07,0.416,0.07,0.349,0.052,0.349
            - 0.234,0.58,0.231,0.492,0.255,0.58
            - 0.329,0.372,0.348,0.377,0.352,0.32,0.327,0.322
            - 0.281,0,0.287,0.145,0.696,0.175,0.696,0.025
            - 0.575,0.533,0.577,0.754,0.649,0.768,0.658,0.494,0.61,0.441
            - 0.721,0.37,0.767,0.37,0.767,0.463,0.722,0.46
      mask: 0.56,0.322,0.56,0.412,0.581,0.414,0.578,0.329
    motion: {}
  Pool_SW:
    enabled: true
    record:
      motion:
        days: 3
    ffmpeg:
      # Decode on the CPU: at night the GPU (VAAPI) failed to decode this HEVC stream about
      # every 2 minutes ("Failed to sync surface"), 212 ffmpeg crashes on 2026-10-22/23
      hwaccel_args: []
      inputs:
        # One connection for both roles: two copies of the 5 MP stream over the NanoBeam link
        # caused corrupt frames and ffmpeg (VAAPI) crashes
        - path: rtsp://admin:{FRIGATE_CAM_PASSWORD_1}@192.168.78.36:554/cam/realmonitor?channel=1&subtype=0
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 2592
      height: 1944
      fps: 5

  jacuzzi:
    enabled: true
    record:
      motion:
        days: 3
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_CAM_PASSWORD_2}@192.168.78.19:9008/profile1
          roles:
            - detect
            - record # profile0 does not exist on the O2VLB5; profile1 (1080p) is its best stream
    detect:
      enabled: true
      width: 1920
      height: 1080
      fps: 5

    objects:
      filters:
        person:
          mask: 
            - 0.06,0.474,0.226,0.478,0.336,0.586,0.396,0.77,0.309,0.941,0.071,0.904
            - 0.925,0.928,0.597,0.958,0.612,0.618,0.767,0.515,0.959,0.506
  Pool_NE:
    enabled: true
    record:
      motion:
        days: 3
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_CAM_PASSWORD_1}@192.168.78.37:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect
        - path: rtsp://admin:{FRIGATE_CAM_PASSWORD_1}@192.168.78.37:554/cam/realmonitor?channel=1&subtype=0
          roles:
            - record
    detect:
      enabled: true
      width: 2592
      height: 1944
      fps: 5

  Pool_farside:
    enabled: true
    record:
      motion:
        days: 3
    ffmpeg:
      # No custom input_args: Frigate's default preset-rtsp-generic adds discardcorrupt,
      # wall-clock timestamps (Reolink's are unreliable) and a 10 s timeout
      inputs:
        # High resolution stream for recording (H.265)
        - path: 
            rtsp://admin:{FRIGATE_CAM_PASSWORD_1}@192.168.78.63:554/h265Preview_01_main
          roles:
            - record
        # Detection over Reolink's HTTP-FLV "ext" stream (896x512 H.264, scaled to 640x360), not
        # RTSP: the camera's RTSP connections drop about every 2 minutes in spells, and this keeps
        # detection running when they do. FLV can't carry the H.265 main stream, so record stays RTSP.
        - path: "http://192.168.78.63/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user=admin&password={FRIGATE_CAM_PASSWORD_1}"
          input_args: preset-http-reolink
          roles:
            - detect
    motion:
      threshold: 35          # Increase from default (usually 25) to ignore subtle ripple shifts
      contour_area: 40       # Minimum pixel cluster size required to trigger motion
    detect:
      enabled: true
      width: 640  # resolution 640 low,  3840 high
      height: 360  # resolution 360 low,  2160 high
      fps: 5
    objects:
      filters:
        person:
          #min_score: 0.4   # percentage confidence  0.4 is 40% probability
          #threshold: 0.5   # rolling average confidence.  0.5 is 50%
          min_area: 100  # global 300 hid swimmers (~120 px on this 640x360 detect stream)
          #max_area: 10000 # 2000 Nothing larger than this.

          mask:
            - 0.154,0.258,0.154,0.066,0.199,0.067,0.207,0.265
            - 0.602,0.223,0.603,0.069,0.645,0.076,0.643,0.223
            - 0.79,0.115,0.981,0.118,0.988,0.301,0.782,0.289
            - 0.041,0.14,0.075,0.145,0.084,0.282,0.047,0.282
            - 0.721,0.125,0.721,0.261,0.755,0.268,0.755,0.127
version: 0.17-0

