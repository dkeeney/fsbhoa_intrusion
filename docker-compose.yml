services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - frigate_net
  frigate:
    container_name: frigate
    privileged: true 
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "1gb" # Increased to handle four high-res cameras
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Max file size before rotating
        max-file: "3"   # Keep only 3 historical files
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate_config:/config # Frigate database (users, events, recording index); not in git
      - ./frigate.yml:/config/config.yml
      - ./storage:/media/frigate
      - type: tmpfs # 1GB In-memory filesystem for recording segments
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    networks:
      - frigate_net
    ports:
      - "8971:8971"
      - "127.0.0.1:5000:5000" # unauthenticated API: local only (the alarm listener); users go through 8971
      - "127.0.0.1:8554:8554" # go2rtc RTSP relay has no login; nothing outside the server uses it
      - "8555:8555/tcp"
      - "8555:8555/udp"
    env_file:
      - .env # Camera passwords (FRIGATE_CAM_PASSWORD_*), not in git; see .env.example
networks:
  frigate_net:
    driver: bridge
